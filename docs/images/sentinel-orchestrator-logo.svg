<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Sentinel Defense — Adversarial AI Scan Orchestration Platform">
  <title>Sentinel Defense — Adversarial AI Scan Orchestration Platform</title>
  <desc>Sentinel banner mark with octopus brand cypher and wordmark.</desc>
  <metadata>
    Sentinel Defense — Adversarial AI Scan Orchestration Platform banner.
    Copyright (c) 2026 Bharath Srinivasan. All rights reserved.
    Proprietary brand asset.
  </metadata>

  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="920" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071323"/>
      <stop offset="0.55" stop-color="#103157"/>
      <stop offset="1" stop-color="#0a6db3"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6ae6ff"/>
      <stop offset="55%" stop-color="#2fb6ff"/>
      <stop offset="100%" stop-color="#1a8cff"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2fb6ff"/>
      <stop offset="100%" stop-color="#1a8cff" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"  stop-color="#eef7ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#6ae6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Recolor filter for the embedded octopus PNG.
         Maps every non-transparent pixel to cyan (#2fb6ff = rgb(47,182,255)
         = rgb(0.184, 0.713, 1.0)) while preserving the alpha channel, so
         the dark-navy silhouette reads cyan against the deep-blue banner
         background. -->
    <filter id="cyanize" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.184
                0 0 0 0 0.713
                0 0 0 0 1.000
                0 0 0 1 0"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="960" height="320" rx="36" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="320" rx="36" fill="url(#bevel)"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.18" stroke="#7ec0ff" stroke-width="0.8">
    <path d="M0 80 H960" />
    <path d="M0 160 H960"/>
    <path d="M0 240 H960"/>
    <path d="M120 0 V320"/>
    <path d="M260 0 V320"/>
    <path d="M860 0 V320"/>
  </g>

  <!-- Sentinel Defense mark — single continuous infinity ribbon traced
       as one closed path. Two octopus eyes inside the loops. Eight
       tentacles flowing from below each loop. -->
  <g transform="translate(40 70) scale(2.6)">
    <!-- Infinity ribbon: figure-8 silhouette pinched at center -->
    <path d="M 8 22
             C 8 8, 24 6, 32 14
             C 38 20, 44 22, 48 22
             C 52 22, 58 20, 64 14
             C 72 6, 88 8, 88 22
             C 88 36, 72 38, 64 30
             C 58 24, 52 22, 48 22
             C 44 22, 38 24, 32 30
             C 24 38, 8 36, 8 22 Z"
          fill="url(#bell)"/>
    <!-- Highlights along upper edge of each loop -->
    <path d="M 14 11 Q 22 9 30 12" fill="none" stroke="#eef7ff" stroke-opacity="0.22" stroke-width="0.8"/>
    <path d="M 66 11 Q 74 9 82 12" fill="none" stroke="#eef7ff" stroke-opacity="0.22" stroke-width="0.8"/>
    <!-- One eye inside each loop -->
    <circle cx="20" cy="22" r="3.2" fill="#07111f"/>
    <circle cx="20" cy="22" r="3.2" fill="none" stroke="#1a8cff" stroke-width="0.6"/>
    <circle cx="21" cy="21" r="1.1" fill="#eef7ff"/>
    <circle cx="76" cy="22" r="3.2" fill="#07111f"/>
    <circle cx="76" cy="22" r="3.2" fill="none" stroke="#1a8cff" stroke-width="0.6"/>
    <circle cx="77" cy="21" r="1.1" fill="#eef7ff"/>
    <!-- 8 tentacles per octopus, flowing from beneath each loop -->
    <g fill="none" stroke="url(#tent)" stroke-width="2.2" stroke-linecap="round">
      <path d="M 9 30 Q 5 42 6 56"/>
      <path d="M 13 33 Q 11 44 12 58"/>
      <path d="M 17 34 Q 16 46 17 60"/>
      <path d="M 21 34 Q 21 47 22 61"/>
      <path d="M 26 34 Q 26 47 28 61"/>
      <path d="M 31 33 Q 32 46 33 60"/>
      <path d="M 35 32 Q 37 44 38 58"/>
      <path d="M 40 30 Q 43 42 42 56"/>
    </g>
    <g fill="none" stroke="url(#tent)" stroke-width="2.2" stroke-linecap="round">
      <path d="M 56 30 Q 53 42 54 56"/>
      <path d="M 61 32 Q 59 44 58 58"/>
      <path d="M 65 33 Q 64 46 63 60"/>
      <path d="M 70 34 Q 70 47 68 61"/>
      <path d="M 75 34 Q 75 47 73 61"/>
      <path d="M 79 34 Q 80 46 79 60"/>
      <path d="M 83 33 Q 85 44 84 58"/>
      <path d="M 87 30 Q 91 42 90 56"/>
    </g>
    <!-- Sensor tips -->
    <g fill="#6ae6ff">
      <circle cx="6" cy="56" r="1"/><circle cx="12" cy="58" r="1"/>
      <circle cx="17" cy="60" r="1"/><circle cx="22" cy="61" r="1"/>
      <circle cx="28" cy="61" r="1"/><circle cx="33" cy="60" r="1"/>
      <circle cx="38" cy="58" r="1"/><circle cx="42" cy="56" r="1"/>
      <circle cx="54" cy="56" r="1"/><circle cx="58" cy="58" r="1"/>
      <circle cx="63" cy="60" r="1"/><circle cx="68" cy="61" r="1"/>
      <circle cx="73" cy="61" r="1"/><circle cx="79" cy="60" r="1"/>
      <circle cx="84" cy="58" r="1"/><circle cx="90" cy="56" r="1"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g fill="#eef7ff">
    <text x="320" y="118" font-family="Inter, 'SF Pro Display', 'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill-opacity="0.85">SENTINEL</text>
    <text x="320" y="200" font-family="Inter, 'SF Pro Display', 'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2">DEFENSE</text>
  </g>

  <!-- Tagline -->
  <g fill="#aedcff" font-family="Inter, 'SF Pro Display', 'Avenir Next', 'Segoe UI', Arial, sans-serif">
    <text x="320" y="232" font-size="18" font-weight="600" letter-spacing="0.5" fill-opacity="0.92">Adversarial AI Scan Orchestration Platform</text>
  </g>

  <!-- Provenance strip -->
  <g fill="#a9bfd6" font-family="Inter, 'SF Pro Display', 'Avenir Next', 'Segoe UI', Arial, sans-serif">
    <text x="320" y="276" font-size="13" font-weight="500" letter-spacing="3" fill-opacity="0.7">PRIVATE-SOURCE · LOCAL-FIRST · MULTI-FRAMEWORK</text>
  </g>

  <!-- Copyright stripe at bottom right -->
  <text x="912" y="304" font-family="Inter, 'SF Pro Display', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#a9bfd6" fill-opacity="0.55"
        text-anchor="end" letter-spacing="1">© 2026 Bharath Srinivasan</text>
</svg>
